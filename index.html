<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uang Kos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Uang Kos</h1>
    <p>Catat uang bulanan supaya tidak habis sebelum akhir bulan.</p>
  </header>

  <main>
    <section class="ringkasan">
      <div class="kartu">
        <p class="label">Pemasukan</p>
        <p class="angka angka-masuk" id="total-pemasukan">Rp 0</p>
      </div>
      <div class="kartu">
        <p class="label">Pengeluaran</p>
        <p class="angka angka-keluar" id="total-pengeluaran">Rp 0</p>
      </div>
      <div class="kartu">
        <p class="label">Saldo</p>
        <p class="angka" id="saldo">Rp 0</p>
      </div>
    </section>

    <section class="kartu">
      <h2>Tambah Transaksi</h2>
      <form id="form-transaksi" novalidate>
        <div class="baris-form">
          <label for="tanggal">Tanggal</label>
          <input type="date" id="tanggal">
        </div>

        <div class="baris-form">
          <label for="jenis">Jenis</label>
          <select id="jenis">
            <option value="pengeluaran">Pengeluaran</option>
            <option value="pemasukan">Pemasukan</option>
          </select>
        </div>

        <div class="baris-form">
          <label for="kategori">Kategori</label>
          <select id="kategori">
            <option value="Makan">Makan</option>
            <option value="Transportasi">Transportasi</option>
            <option value="Tagihan">Tagihan</option>
            <option value="Belanja">Belanja</option>
            <option value="Hiburan">Hiburan</option>
            <option value="Uang Saku">Uang Saku</option>
            <option value="Lainnya">Lainnya</option>
          </select>
        </div>

        <div class="baris-form">
          <label for="nominal">Nominal (Rp)</label>
          <input type="number" id="nominal">
        </div>

        <div class="baris-form">
          <label for="catatan">Catatan (opsional)</label>
          <input type="text" id="catatan">
        </div>

        <button type="submit">Simpan</button>
        <ul id="daftar-error" role="alert"></ul>
        <p id="pesan" role="status"></p>
      </form>
    </section>

    <section class="kartu">
      <h2>Daftar Transaksi</h2>
      <ul id="daftar-transaksi"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
